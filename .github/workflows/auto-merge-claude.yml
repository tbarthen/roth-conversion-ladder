name: Auto-merge Claude branches to main

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write

jobs:
  merge-to-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Nothing reaches main (and the live site) unless the tax math,
      # the rates data and the fetcher all pass their tests.
      - name: Test tax engine and rates data
        run: |
          node scripts/sync-rates.js --check
          node --test tests/*.test.js

      - name: Test fetcher
        run: python3 -m unittest discover -s fetcher/tests -t fetcher

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge into main
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          git checkout main
          git merge "$MERGE_SHA" --no-edit -m "Auto-merge $BRANCH_NAME into main"
          git push origin main
