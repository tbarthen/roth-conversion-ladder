/* ============================================================
   GLOBAL STYLES & CSS VARIABLES

:root {
  --bg-primary: #f8f9fa;

  --text-primary: #1a202c;
  --text-secondary: #4a5568;
  --text-muted: #718096;
  --border: #e2e8f0;
  --accent-teal: #0d9488;
  --accent-teal-light: #ccfbf1;
  --accent-teal-dark: #0f766e;
  --accent-green: #059669;
  --accent-green-light: #d1fae5;
  --accent-orange: #ea580c;
  --accent-orange-light: #fff7ed;
  --accent-red: #dc2626;
  --accent-red-light: #fef2f2;
  --accent-blue: #2563eb;
  --accent-blue-light: #eff6ff;
  --accent-purple: #7c3aed;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
  --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.04);
  --radius: 8px;
  --radius-lg: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  line-height: 1.5;
}
.app-container { max-width: 1400px; margin: 0 auto; padding: 20px; }
h1 { font-size: 1.75rem; font-weight: 700; color: var(--accent-teal-dark); }
h2 { font-size: 1.25rem; font-weight: 600; color: var(--text-primary); margin-bottom: 12px; }
h3 { font-size: 1rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }

/* (app-header merged into input card) */

/* Cards */
.card {
  background: var(--bg-card); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md); padding: 24px; margin-bottom: 16px;
}
/* Form styles */
.form-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px; max-width: 780px;
}
.form-group { display: flex; flex-direction: column; }
.form-group label {
  font-size: 0.8rem; font-weight: 500; color: var(--text-secondary);
  margin-bottom: 4px;
}
.form-group input, .form-group select {
  padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius);
  font-size: 0.9rem; background: var(--bg-input); transition: border-color 0.2s, background 0.2s;
}
.form-group input:focus, .form-group select:focus {
  outline: none; border-color: var(--accent-teal); box-shadow: 0 0 0 3px rgba(13,148,136,0.1);
}
.form-group input[type="number"] { -moz-appearance: textfield; }
.form-group input::-webkit-outer-spin-button,
.form-group input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.form-group.profile-tinted input,
.form-group.profile-tinted select { background-color: #f0fdf4; }
.form-group.field-defaulted input,
.form-group.field-defaulted select { background-color: #fef9c3; border-color: #eab308; }
.form-group.field-defaulted .input-wrapper { border-radius: var(--radius); }

.income-streams { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
.income-streams .streams-title { font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); }
.income-streams .streams-help { font-size: 0.78rem; color: var(--text-muted); margin: 4px 0 10px; line-height: 1.4; }
.income-row { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px 8px; margin-bottom: 10px; background: var(--bg-input); }
.income-row .form-grid { max-width: none; }
.income-row .form-group input[type="text"] { padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.9rem; background: white; }
.income-row .income-row-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.income-row .income-row-desc { font-size: 0.78rem; color: var(--text-muted); line-height: 1.4; }
.income-row .remove-income { background: none; border: 1px solid var(--border); color: var(--accent-red); border-radius: var(--radius); padding: 4px 10px; font-size: 0.78rem; cursor: pointer; }
.income-row .remove-income:hover { background: #fef2f2; }
.add-income { padding: 8px 14px; border-radius: var(--radius); border: 1px dashed var(--accent-teal); background: white; color: var(--accent-teal); font-weight: 600; font-size: 0.85rem; cursor: pointer; }
.add-income:hover { background: #f0fdfa; }

/* "What matters most to you?" — two radio cards near the top of the form */
.goal-choice { margin-top: 14px; }
.goal-question { font-weight: 600; font-size: 0.95rem; margin-bottom: 8px; }
.goal-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.goal-option {

  border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-input);
  transition: border-color 0.2s, background 0.2s;
}
.goal-option:hover { border-color: var(--accent-teal); }
.goal-option.selected { border-color: var(--accent-teal); background: #f0fdfa; box-shadow: 0 0 0 3px rgba(13,148,136,0.1); }
.goal-option input { margin-top: 3px; accent-color: var(--accent-teal); }
.goal-option .goal-title { font-weight: 600; font-size: 0.9rem; color: var(--text-primary); }

const { useState, useMemo, useCallback, useRef, useEffect } = React;

   ============================================================ */
const E = window.TaxEngine;
const EMBEDDED_RATES = JSON.parse(document.getElementById('embedded-rates').textContent);
const FETCHER_CONFIG_KEY = 'roth-optimizer-fetcher';

const fmtDate = (iso) => {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00Z');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
};

const loadFetcherConfig = () => {
  try {
    const raw = localStorage.getItem(FETCHER_CONFIG_KEY);
    const cfg = raw ? JSON.parse(raw) : null;
    return cfg && typeof cfg.url === 'string' && /^https:\/\/[a-z0-9.-]+\.run\.app(\/|$)/i.test(cfg.url) ? cfg : null;
  } catch (err) {
    return null;
  }
};

/* ============================================================
   MODULE 8: UI COMPONENTS
   React components for input form, results, tables, and charts.
   ============================================================ */

/* ---- Utility formatters ---- */
const fmt = (n) => {
  if (n === undefined || n === null || isNaN(n)) return '$0';
  const abs = Math.abs(Math.round(n));
  const formatted = abs.toLocaleString('en-US');
  return n < 0 ? `-$${formatted}` : `$${formatted}`;
};
const fmtPct = (n) => `${(n * 100).toFixed(0)}%`;
const fmtRate = (n) => `${n.toFixed(1)}%`;

/* Build a deflator closure for converting nominal year-offset dollars back
 * to today's purchasing power. When showReal is false, returns value as-is. */
const makeDeflate = (showReal, inflationRate) => (val, yearOffset) =>
  showReal ? val / Math.pow(1 + (inflationRate || 0) / 100, yearOffset) : val;

const effectiveRate = E.effectiveRate;

/* ---- Collapsible Section ---- */

  return React.createElement('div', null,
    React.createElement('div', {
      className: 'collapsible-header',
      onClick: () => setOpen(!open)
    },
      React.createElement('span', { className: `arrow ${open ? 'open' : ''}` }, '\u25B6'),
      React.createElement('h3', null, title),

const PROFILE_STORAGE_KEY = 'roth-optimizer-profile';
/* v2 added `goal`; a v1 export has none and loads as the lifetime-tax goal. */
const PROFILE_SCHEMA_VERSION = 2;

const loadSavedProfile = () => {
  try {
    const raw = localStorage.getItem(PROFILE_STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    return parsed && typeof parsed === 'object' ? parsed : null;
  } catch (err) {
    console.warn('Could not read saved profile:', err);
    return null;
  }
};

const saveProfileToStorage = (inputs) => {

    localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(inputs));
    return true;
  } catch (err) {
    console.warn('Could not save profile:', err);
    return false;
  }
};

const getFieldByPath = (obj, path) => {
  const parts = path.split('.');
  let cursor = obj;
  for (const part of parts) {
    if (cursor == null || typeof cursor !== 'object') return undefined;
    cursor = cursor[part];
  }
  return cursor;
};

const UNSAFE_PATH_SEGMENTS = new Set(['__proto__', 'constructor', 'prototype']);
const setFieldByPath = (obj, path, value) => {
  const parts = path.split('.');
  /* Refuse any path that could reach the prototype chain. Today only
   * internal INPUT_FIELD_PATHS are passed in, so this is a safety net
   * against future regressions that might route user-controlled keys here. */
  if (parts.some(p => UNSAFE_PATH_SEGMENTS.has(p))) {
    console.warn('Rejected unsafe field path:', path);
    return;
  }
  let cursor = obj;
  for (let i = 0; i < parts.length - 1; i++) {
    if (cursor[parts[i]] == null || typeof cursor[parts[i]] !== 'object') {
      cursor[parts[i]] = {};
    }
    cursor = cursor[parts[i]];
  }
  cursor[parts[parts.length - 1]] = value;
};

/* Walk imported object against the canonical field list. Fields present on
 * the import win; fields missing (e.g. from an older export) fall through to
 * defaults and are reported as missingPaths. Extra keys in the import are
 * silently dropped. */
const mergeInputsWithDefaults = (rawImported) => {
  const merged = makeDefaultInputs();
  const missingPaths = [];
  if (!rawImported || typeof rawImported !== 'object') {
    return { inputs: merged, missingPaths: [...INPUT_FIELD_PATHS] };
  }
  /* Older profiles stored a flat stateTaxRate. With no state picked it was a
     hand-typed rate, so carry it over as an override; with a state picked the
     state's own brackets now apply. */
  const imported = { ...rawImported };
  /* Older profiles had one pension amount instead of the income list. */
  if (imported.incomeStreams === undefined && imported.pensionIncome !== undefined) {
    imported.incomeStreams = streamsFromPension(imported.pensionIncome, imported.retirementAge);
  }
  if (Array.isArray(imported.incomeStreams)) {
    imported.incomeStreams = imported.incomeStreams.filter(x => x && typeof x === 'object').map(x => makeIncomeStream(x));
  }
  if (imported.convertWhileWorking === true) imported.convertWhileWorking = 'yes';
  if (imported.convertWhileWorking === false) imported.convertWhileWorking = 'no';
  if (imported.stateTaxRateOverride === undefined && imported.stateTaxRate !== undefined) {
    imported.stateTaxRateOverride = (!imported.stateAbbr || imported.stateAbbr === '--') && Number(imported.stateTaxRate) > 0
      ? Number(imported.stateTaxRate) : '';
  }
  for (const path of INPUT_FIELD_PATHS) {
    const value = getFieldByPath(imported, path);
    if (value === undefined) {
      if (!SURVIVOR_FIELD_PATHS.has(path) || imported.filingStatus === 'widowed') missingPaths.push(path);
    } else {
      setFieldByPath(merged, path, path === 'goal' ? normalizeGoal(value) : value);
    }
  }
  return { inputs: merged, missingPaths };
};

const buildExportPayload = (inputs) => {
  const payload = {
    schemaVersion: PROFILE_SCHEMA_VERSION,
    exportDate: new Date().toISOString()
  };
  for (const path of INPUT_FIELD_PATHS) {
    setFieldByPath(payload, path, getFieldByPath(inputs, path));
  }
  return payload;
};

/* ---- Input Form Component ---- */
function InputForm({ inputs, setInputs, onCalculate, rates, taxDataLine, validation, hasSavedProfile, onSaveProfile }) {
  const states = rates.items.stateIncomeTax.value.states;
  const fieldMessages = (key) => validation
    ? [...validation.errors.filter(e => e.field === key).map(e => ({ ...e, level: 'error' })),
       ...validation.warnings.filter(w => w.field === key).map(w => ({ ...w, level: 'warning' }))]
    : [];
  const [showAdvancedGrowth, setShowAdvancedGrowth] = useState(false);
  const [selectedProfile, setSelectedProfile] = useState(() => hasSavedProfile ? 'my-profile' : '');
  const [profileFields, setProfileFields] = useState(new Set());
  const [editedFields, setEditedFields] = useState(new Set());
  const [defaultedFields, setDefaultedFields] = useState(new Set());
  const [importBanner, setImportBanner] = useState(null);
  const [showStickyCalc, setShowStickyCalc] = useState(false);
  const fileInputRef = useRef(null);
  const calcBtnRef = useRef(null);

  /* Intersection observer for sticky calculate button */
  useEffect(() => {
    if (!calcBtnRef.current) return;
    const observer = new IntersectionObserver(
      ([entry]) => setShowStickyCalc(!entry.isIntersecting),
      { threshold: 0 }
    );
    observer.observe(calcBtnRef.current);
    return () => observer.disconnect();
  }, []);

  const clearDefaultedPath = (path) => {
    setDefaultedFields(prev => {
      if (!prev.has(path)) return prev;
      const next = new Set(prev);
      next.delete(path);
      return next;
    });
  };

  const update = (field, value) => {
    setEditedFields(prev => new Set(prev).add(field));
    clearDefaultedPath(field);
    setInputs(prev => {
      const next = { ...prev, [field]: value };
      if (field === 'preRetirementGrowth' && !showAdvancedGrowth) {
        next.rothGrowth = value;
        next.taxableGrowth = value;
      }
      return next;
    });
  };
  const updateNested = (parent, field, value) => {
    setEditedFields(prev => new Set(prev).add(`${parent}.${field}`));
    clearDefaultedPath(`${parent}.${field}`);
    setInputs(prev => ({
      ...prev,
      [parent]: { ...prev[parent], [field]: value }
    }));
  };

  const applyProfile = (profileValue) => {
    setSelectedProfile(profileValue);
    /* "My Profile" loads the user's saved localStorage snapshot. No tinting —
     * every field would be highlighted, which isn't useful when the user is
     * looking at their own data. */
    if (profileValue === 'my-profile') {
      const saved = loadSavedProfile();
      if (!saved) return;
      const { inputs: merged } = mergeInputsWithDefaults(saved);
      setProfileFields(new Set());
      setEditedFields(new Set());
      setDefaultedFields(new Set());
      setImportBanner(null);
      setInputs(merged);
      return;
    }
    const profile = SAMPLE_PROFILES.find(p => p.value === profileValue);
    if (!profile || !profile.data) return;
    /* Track which fields this profile sets */
    const fields = new Set();
    Object.keys(profile.data).forEach(k => {
      if (k === 'annualContributions') {
        Object.keys(profile.data[k]).forEach(ck => fields.add(`annualContributions.${ck}`));
      } else {
        fields.add(k);
      }
    });
    setProfileFields(fields);
    setEditedFields(new Set());
    setInputs(prev => ({
      ...prev,
      ...profile.data,
      /* Deep-merge nested objects so a partial profile doesn't zero out
       * unspecified nested fields (e.g. roth/taxable/hsa contributions). */
      annualContributions: {
        ...prev.annualContributions,
        ...(profile.data.annualContributions || {})
      },
      stateAbbr: prev.stateAbbr,
      stateTaxRateOverride: prev.stateTaxRateOverride,
      goal: prev.goal,
      heirTaxRate: prev.heirTaxRate,
      preRetirementGrowth: prev.preRetirementGrowth,
      rothGrowth: prev.rothGrowth,
      taxableGrowth: prev.taxableGrowth,
      dividendYield: prev.dividendYield,
      /* the sample's taxable balance differs, so an old basis would be meaningless */
      taxableCostBasis: '',
      inflationRate: prev.inflationRate,
      bracketInflation: prev.bracketInflation,
      targetBracket: prev.targetBracket,
      customConversion: prev.customConversion,
      taxPaymentSource: prev.taxPaymentSource,
      convertWhileWorking: prev.convertWhileWorking
    }));
  };

  const onExport = () => {
    const payload = buildExportPayload(inputs);
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    const dateStr = new Date().toISOString().slice(0, 10);
    link.href = url;
    link.download = `roth-optimizer-inputs-${dateStr}.json`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  };

  const onImportFile = (file) => {
    if (!file) return;
    if (file.size > 1_000_000) {
      alert('That file is too large. Profile exports from this app are under 10 KB.');
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        const { inputs: merged, missingPaths } = mergeInputsWithDefaults(parsed);
        setInputs(merged);
        setProfileFields(new Set());
        setEditedFields(new Set());
        setDefaultedFields(new Set(missingPaths));
        setSelectedProfile('');
        setImportBanner({ missingPaths, showSaveOffer: true });
      } catch (err) {
        alert('Could not read that file. Make sure it\u2019s a valid JSON export from this app.\n\n' + err.message);
      }
    };
    reader.readAsText(file);
  };

  const onDismissBanner = () => {
    setImportBanner(null);
    setDefaultedFields(new Set());
  };

  const onSaveImportAsProfile = () => {
    if (onSaveProfile) onSaveProfile();
    setImportBanner(prev => prev ? { ...prev, showSaveOffer: false, justSaved: true } : prev);
  };

  const isTinted = (fieldName, nested, parentField) => {
    const key = nested ? `${parentField}.${fieldName}` : fieldName;
    return profileFields.has(key) && !editedFields.has(key);
  };

  const isDefaulted = (fieldName, nested, parentField) => {
    const key = nested ? `${parentField}.${fieldName}` : fieldName;
    return defaultedFields.has(key);
  };

  const isMFJ = inputs.filingStatus === 'marriedFilingJointly';
  const goal = normalizeGoal(inputs.goal);

  /* Compact currency for summary lines */
  const fmtCompact = (v) => {
    const n = Number(v) || 0;
    if (n === 0) return null;
    if (n >= 1000000) return `$${(n / 1000000).toFixed(1).replace(/\.0$/, '')}M`;
    if (n >= 1000) return `$${(n / 1000).toFixed(0)}K`;
    return `$${n.toLocaleString()}`;
  };

  const isRetired = inputs.retirementAge && inputs.currentAge && Number(inputs.retirementAge) <= Number(inputs.currentAge);
  /* A start age below the current age means the benefit is already paid:
     the amount entered is what arrives now and is not adjusted again. */
  const ssCollecting = Number(inputs.ssStartAge) < Number(inputs.currentAge);
  const spouseSsCollecting = isMFJ && Number(inputs.spouseSsStartAge) < Number(inputs.spouseAge);
  const isWidowed = inputs.filingStatus === 'widowed';
  const survivorCollecting = isWidowed && Number(inputs.survivorStartAge) < Number(inputs.currentAge);
  const lateSpouseHadStarted = inputs.survivorBenefitType === 'collecting';
  /* Survivor-benefit figures, from the rates document */
  const sv = rates.items.socialSecuritySurvivor.value;
  const survivorPctAtEarliest = `${Math.round((1 - sv.maxReduction) * 1000) / 10}%`;
  const survivorFloorPct = `${Math.round(sv.earlyClaimerFloor * 1000) / 10}%`;
  const survivorStartHelp = `As a widow or widower you can start a survivor benefit at ${sv.earliestClaimAge}. It is ${survivorPctAtEarliest} of the full amount at ${sv.earliestClaimAge} and rises each month to 100% at your survivor full retirement age (66\u201367); waiting past that adds nothing. Already collecting it? Enter the age you started. You can take one benefit first and switch to the other later; each year we pay whichever of your two benefits is larger. (Remarrying before ${sv.remarriageCutoffAge} ends the survivor benefit; if that applies, leave the amount blank.)`;
  const marriedSurvivorHelp = `If your spouse dies first you can take a survivor benefit from ${sv.earliestClaimAge} (${survivorPctAtEarliest} of theirs, rising to 100% at your survivor full retirement age of 66\u201367). We start it at this age or when the projection has your spouse die, whichever is later, and pay whichever of your two benefits is larger each year.`;

  /* Personal Info summary */
  const filingAbbr = { marriedFilingJointly: 'MFJ', single: 'Single', widowed: 'Widowed', marriedFilingSeparately: 'MFS' };
  const selectedState = states.find(s => s.abbr === inputs.stateAbbr);
  const hasOverride = inputs.stateTaxRateOverride !== '' && inputs.stateTaxRateOverride !== null && inputs.stateTaxRateOverride !== undefined;
  const personalSummary = [
    inputs.currentAge ? `Age ${inputs.currentAge}` : null,
    inputs.retirementAge ? `Retire ${inputs.retirementAge}` : null,
    filingAbbr[inputs.filingStatus] || null,
    selectedState ? selectedState.name : null,
    hasOverride ? `State rate ${inputs.stateTaxRateOverride}%` : null,
    inputs.lifeExpectancy && inputs.lifeExpectancy != 90 ? `LE ${inputs.lifeExpectancy}` : null
  ].filter(Boolean).join(', ') || 'Not set';

  /* Spouse Info summary */
  const spouseSummary = [
    inputs.spouseAge ? `Age ${inputs.spouseAge}` : null,
    inputs.spouseLifeExpectancy ? `LE ${inputs.spouseLifeExpectancy}` : null
  ].filter(Boolean).join(', ') || 'Not set';

  /* Account Balances summary */
  const balParts = [

/* ---- Banner: only when data is stale or newer data is available ---- */
function TaxDataBanner({ rates, pendingRates, checkState, onCheck, onApply, onDismiss }) {
  const fresh = E.ratesFreshness(rates);
  if (!pendingRates && !fresh.stale) return null;
  let title, body;
  if (pendingRates) {
    title = 'Newer tax figures are available';
    body = `Found ${pendingRates.taxYear} figures (updated ${fmtDate(pendingRates.lastUpdated)}). This page is using ${rates.taxYear} figures from ${fmtDate(rates.lastUpdated)}.`;
  } else {
    title = 'Tax figures may be out of date';
    const parts = [];
    if (fresh.reasons.includes('newTaxYear')) parts.push(`It’s ${fresh.currentYear}, but this page is still using ${rates.taxYear} figures (the new year’s figures may not be published yet).`);
    if (fresh.reasons.includes('notCheckedRecently')) parts.push(`The figures were last checked ${fresh.daysSinceCheck} days ago.`);
    body = parts.join(' ') + ' Results are still a reasonable estimate.';
  }
  return React.createElement('div', { className: 'data-banner', role: 'status' },

/* ---- Show the math for one year ---- */
function YearMath({ result, rates }) {
  const scenarios = [
    { key: 'B', label: 'Suggested plan', data: result.scenarioB },
    { key: 'A', label: 'No conversion', data: result.scenarioA },
    result.scenarioC && { key: 'C', label: 'Custom', data: result.scenarioC }
  ].filter(Boolean);
  const [scenKey, setScenKey] = useState('B');
  const scen = scenarios.find(x => x.key === scenKey) || scenarios[0];
  const firstConv = scen.data.findIndex(r => r.conversionAmount > 0);
  const [idx, setIdx] = useState(firstConv >= 0 ? firstConv : 0);
  const r = scen.data[Math.min(idx, scen.data.length - 1)];
  const t = r.taxDetail;
  const pct = (x) => `${(x * 100).toFixed(x * 100 % 1 ? 1 : 0)}%`;
  const row = (label, value, opts = {}) => React.createElement('tr', { className: opts.total ? 'math-total' : opts.sub ? 'math-sub' : '' },
    React.createElement('td', null, label),
    React.createElement('td', null, opts.raw ? value : fmt(value))
  );
  const section = (title) => React.createElement('tr', { className: 'math-section' }, React.createElement('td', { colSpan: 2 }, title));
  const iraTotal = r.rmd + r.conversionAmount + r.tradWithdrawal;
  const cash = r.rmd + r.ssIncome + r.pension + (r.otherIncomeTaxFree || 0);
  const streamRows = (r.incomeStreams || []).filter(x => x.taxable !== 'socialSecurity');
  const ssLike = (r.incomeStreams || []).filter(x => x.taxable === 'socialSecurity');
  const payingSection = !r.working || r.conversionAmount > 0;

  return React.createElement('div', { className: 'card' },
    React.createElement('h2', null, 'Show the math'),
    React.createElement('p', { className: 'chart-caption' },
      `Step-by-step tax calculation for one year, in that year’s dollars (brackets and limits indexed from ${rates.taxYear}). The suggested plan is the one that ${result.goal === 'heirs' ? 'leaves the most to your heirs after all taxes' : 'leaves you the most to spend at the end without leaving you short of money'}; pick a year to see how its tax is worked out.`),
    React.createElement('div', { className: 'math-controls' },
      React.createElement('select', { value: scenKey, onChange: e => setScenKey(e.target.value) },
        scenarios.map(x => React.createElement('option', { key: x.key, value: x.key }, x.label))),
      React.createElement('select', { value: idx, onChange: e => setIdx(Number(e.target.value)) },
        scen.data.map((y, i) => React.createElement('option', { key: y.year, value: i },
          `${y.year} (age ${y.age})${y.conversionAmount > 0 ? ' — conversion' : ''}`)))
    ),
    React.createElement('table', { className: 'math-table' },
      React.createElement('tbody', null,
        section('1. Income'),
        r.wages > 0 && row('Wages (after pre-tax 401(k)/HSA contributions)', r.wages),
        ...streamRows.map((x, i) => row(`${x.name}${x.taxable === 'partial' ? ` (${x.taxablePercent}% of ${fmt(x.amount)} is taxable)` : ''}`, x.taxablePart)),
        iraTotal > 0 && row(`Traditional IRA/401(k) withdrawals (RMD ${fmt(r.rmd)} + conversion ${fmt(r.conversionAmount)} + extra ${fmt(r.tradWithdrawal)})`, iraTotal),
        r.hsaWithdrawal > 0 && row('HSA withdrawals (non-medical)', r.hsaWithdrawal),
        r.dividendIncome > 0 && row('Dividends (taxable account)', r.dividendIncome),
        r.realizedCapGains > 0 && row('Capital gains from selling taxable investments', r.realizedCapGains),
        r.ssIncome > 0 && row(`Social Security ${fmt(r.ssIncome)}${r.ssSource === 'survivor' ? ' (survivor benefit' + (r.ssIncome > r.ssSurvivor + 0.5 ? ' + spouse' : '') + ')' : ''}${ssLike.length ? ` (incl. ${ssLike.map(x => `${x.name} ${fmt(x.amount)}`).join(', ')}, taxed the same way)` : ''} — taxable part`, t.taxableSS),
        row('Adjusted gross income (AGI)', t.agi, { total: true }),
        section('2. Deductions'),
        row(`Standard deduction${r.age >= 65 ? ' (incl. extra for age 65+)' : ''}`, -t.stdDeduction),
        t.seniorBonus > 0 && row('Senior deduction (2025–2028)', -t.seniorBonus),
        row('Taxable income', t.taxableIncome, { total: true }),
        t.preferentialIncome > 0 && row('…of which dividends & gains (lower rates)', t.preferentialIncome, { sub: true }),
        section('3. Federal income tax on ordinary income'),
        ...t.bracketFill.filter(f => f.filled > 0).map(f =>
          row(`${pct(f.rate)} on ${fmt(f.filled)}`, f.tax, { sub: true })),
        row('Federal income tax', t.federalTax, { total: true }),
        t.cgTax > 0 && row('Tax on dividends & capital gains (0/15/20%)', t.cgTax),
        t.niit > 0 && row('Net investment income tax (3.8%)', t.niit),
        section('4. State, Medicare and penalties'),
        t.stateExcludedRetirement > 0 && row('State: retirement income your state doesn\u2019t tax', -t.stateExcludedRetirement, { sub: true }),
        t.stateDeduction > 0 && row('State: standard deduction and personal exemptions', -t.stateDeduction, { sub: true }),
        row(`State income tax on ${fmt(t.stateTaxableIncome)}${t.stateCredit > 0 ? ` (after a ${fmt(t.stateCredit)} personal credit)` : ''}`, t.stateTax),
        r.irmaaSurcharge > 0 && row(`Medicare surcharge (IRMAA ${r.irmaaTier}, based on ${r.year - 2} income of ${fmt(r.irmaaMagi)})`, r.irmaaSurcharge),
        r.earlyWithdrawalPenalty > 0 && row('10% early-withdrawal penalty (traditional)', r.earlyWithdrawalPenalty),
        r.rothPenalty > 0 && row('10% early-withdrawal penalty (Roth)', r.rothPenalty),
        r.hsaPenalty > 0 && row('20% HSA penalty (before 65)', r.hsaPenalty),
        row('Total tax this year', r.totalTax, { total: true }),
        row('Top federal bracket reached', pct(r.marginalRate), { raw: true, sub: true }),
        payingSection && section(r.working ? '5. Paying the conversion tax while working' : '5. Paying for the year'),
        payingSection && !r.working && row('Spending goal', r.spendingTarget),
        payingSection && !r.working && row('+ taxes', r.totalTax),
        payingSection && r.working && row('Taxes this year', r.totalTax),
        payingSection && r.working && row('− covered by your paycheck (the tax there would be without a conversion)', -r.paycheckTax),
        payingSection && !r.working && cash > 0 && row('− Social Security, other income and RMD cash', -cash),
        payingSection && r.taxFromConversion > 0 && row('− tax withheld from the conversion', -r.taxFromConversion),
        payingSection && r.taxableWithdrawal > 0 && row('Taken from taxable account', r.taxableWithdrawal, { sub: true }),
        payingSection && r.rothWithdrawal > 0 && row('Taken from Roth', r.rothWithdrawal, { sub: true }),
        payingSection && r.tradWithdrawal > 0 && row('Taken from traditional IRA/401(k)', r.tradWithdrawal, { sub: true }),
        payingSection && r.hsaWithdrawal > 0 && row('Taken from HSA', r.hsaWithdrawal, { sub: true }),
        payingSection && r.surplusReinvested > 0 && row('Extra cash reinvested in taxable account', r.surplusReinvested, { sub: true }),
        payingSection && r.unmetSpending > 0 && row('Shortfall — not enough savings', r.unmetSpending, { total: true })
      )
    )
  );
}

/* ---- Summary numbers (details view) ---- */
function SummaryDashboard({ result, showReal, inflationRate }) {
  const { scenarioA, scenarioB, scenarioC, breakevenAge, chosen } = result;
  if (!scenarioA?.length || !scenarioB?.length) {
    return React.createElement('div', { className: 'card', style: { textAlign: 'center', padding: 40, color: 'var(--text-muted)' } },
      'Unable to generate projection with these inputs. Please check your age, spending, and account balances.');
  }
  const deflate = makeDeflate(showReal, inflationRate);
  const sumOver = (s, key) => s.reduce((acc, y, i) => acc + deflate(y[key] || 0, i), 0);
  const lastIdxA = scenarioA.length - 1, lastIdxB = scenarioB.length - 1;
  const lastA = scenarioA[lastIdxA], lastB = scenarioB[lastIdxB];
  const lastC = scenarioC ? scenarioC[scenarioC.length - 1] : null;
  const lastIdxC = scenarioC ? scenarioC.length - 1 : 0;

  const taxA = sumOver(scenarioA, 'totalTax'), taxB = sumOver(scenarioB, 'totalTax');
  const netA = deflate(lastA.netPosition, lastIdxA), netB = deflate(lastB.netPosition, lastIdxB);
  const netDiff = netB - netA;
  const irmaaYears = scenarioB.filter(y => y.irmaaSurcharge > 0).length;
  const capGainsTaxTotal = sumOver(scenarioB, 'capGainsTax');
  const niitTotal = sumOver(scenarioB, 'niit');
  const penaltyTotal = sumOver(scenarioB, 'rothPenalty') + sumOver(scenarioB, 'earlyWithdrawalPenalty') + sumOver(scenarioB, 'hsaPenalty');
  const unmetB = sumOver(scenarioB, 'unmetSpending');
  const card = (cls, label, value, valueCls, sub) => React.createElement('div', { className: `summary-card ${cls}` },
    React.createElement('div', { className: 'label' }, label),
    React.createElement('div', { className: `value ${valueCls}` }, value),
    React.createElement('div', { className: 'sub' }, sub));

  const heirsGoal = result.goal === 'heirs';
  const goalText = heirsGoal ? 'the most left to heirs after tax' : 'the most spendable wealth at the end among plans that never run short of money';
  const spendA = deflate(lastA.spendableWealth, lastIdxA), spendB = deflate(lastB.spendableWealth, lastIdxB);
  const spendDiff = spendB - spendA;
  const wealthCard = heirsGoal
    ? card(netDiff > 0 ? 'positive' : 'negative', 'After-Tax Wealth Advantage', fmt(netDiff), netDiff > 0 ? 'green' : 'red',
      `No Conversion: ${fmt(netA)} vs Plan: ${fmt(netB)} at age ${lastB.age} (traditional balances counted after heirs' tax) · the figure the plan was chosen on`)
    : card(spendDiff > 0 ? 'positive' : 'negative', 'Spendable Wealth Advantage', fmt(spendDiff), spendDiff > 0 ? 'green' : 'red',
      `No Conversion: ${fmt(spendA)} vs Plan: ${fmt(spendB)} at age ${lastB.age} (all accounts, minus the tax to draw them down over ${E.DRAWDOWN_YEARS} years: ${fmt(deflate(lastA.drawdownTax, lastIdxA))} vs ${fmt(deflate(lastB.drawdownTax, lastIdxB))}) · the figure the plan was chosen on`);
  const taxCard = card(taxA - taxB >= 0 ? 'positive' : 'neutral', 'Lifetime Taxes', fmt(taxB), 'blue',
    `No Conversion: ${fmt(taxA)} · difference ${fmt(taxA - taxB)}`);

  return React.createElement('div', null,
    React.createElement('p', { className: 'details-note' },
      `Suggested plan: fill up to the ${Math.round(chosen.rate * 100)}% bracket` +
      (chosen.irmaaMode === 'avoid' ? ', staying under the next Medicare IRMAA threshold' : ', ignoring Medicare IRMAA thresholds') +
      (chosen.auto ? ` (chosen automatically from every bracket, with and without IRMAA limits, for ${goalText}).` : ` (your chosen bracket; with and without IRMAA limits, for ${goalText}).`)),
    React.createElement('div', { className: 'summary-grid' },
      wealthCard,
      taxCard,
      card('neutral', 'Breakeven Age', breakevenAge ? `Age ${breakevenAge}` : 'N/A', 'blue',
        breakevenAge ? 'When lifetime taxes drop back to (or below) the no-conversion path' : 'Plan never pays more tax in total, or never catches up'),
      irmaaYears > 0 && card('warning', 'IRMAA Years', `${irmaaYears} years`, 'red', 'Years with Medicare income surcharges in the plan'),
      capGainsTaxTotal > 0 && card('neutral', 'Lifetime Capital Gains Tax', fmt(capGainsTaxTotal), 'blue', 'On realized gains and dividends from the taxable account'),
      niitTotal > 0 && card('warning', 'Lifetime NIIT', fmt(niitTotal), 'red', '3.8% surtax on net investment income'),
      penaltyTotal > 0 && card('warning', 'Early Withdrawal Penalties', fmt(penaltyTotal), 'red', '10% (IRA/Roth before 59½) and 20% (HSA before 65) penalties'),
      unmetB > 0 && card('warning', 'Unfunded Spending', fmt(unmetB), 'red', 'Spending the plan could not pay for after savings ran out'),
      lastC && (heirsGoal
        ? card('neutral', 'Custom Strategy', fmt(deflate(lastC.netPosition, lastIdxC)), 'blue',
          `After-tax wealth at age ${lastC.age} · lifetime taxes ${fmt(sumOver(scenarioC, 'totalTax'))}`)
        : card('neutral', 'Custom Strategy', fmt(deflate(lastC.spendableWealth, lastIdxC)), 'blue',
          `Spendable wealth at age ${lastC.age} · lifetime taxes ${fmt(sumOver(scenarioC, 'totalTax'))}`))
    )
  );
}

/* ---- Conversion Schedule Summary Panel ---- */
function ConversionSchedule({ data, scenarioLabel, showReal, inflationRate }) {
  const deflate = makeDeflate(showReal, inflationRate);

  // Collect conversion years with nominal running totals, preserving original index for deflation
  const conversionRows = [];
  let cumConvertedNominal = 0;
  data.forEach((row, i) => {
    if (row.conversionAmount > 0) {
      cumConvertedNominal += row.conversionAmount;
      conversionRows.push({
        year: row.year,
        age: row.age,
        conversionAmount: row.conversionAmount,
        totalTax: row.totalTax,
        tradBal: row.tradBal,
        cumConverted: cumConvertedNominal,
        origIdx: i
      });
    }
  });

  if (conversionRows.length === 0) {
    return React.createElement('div', { className: 'card schedule-card' },
      React.createElement('h3', null, 'Your Conversion Schedule'),
      React.createElement('p', { style: { margin: 0, fontSize: '0.9rem' } },
        'No Roth conversions are recommended in this scenario.')
    );
  }

  // Summary metrics
  const totalConvertedNominal = cumConvertedNominal;
  const totalTaxCostNominal = conversionRows.reduce((sum, r) => sum + r.totalTax, 0);
  const startYear = conversionRows[0].year;
  const endYear = conversionRows[conversionRows.length - 1].year;
  const nYears = conversionRows.length;
  const lastIdx = conversionRows[conversionRows.length - 1].origIdx;

  // Deflate summary totals consistently with how the table's last row is displayed
  const totalConvertedDisp = deflate(totalConvertedNominal, lastIdx);
  const totalTaxCostDisp = deflate(totalTaxCostNominal, lastIdx);

  // Find first year Traditional balance effectively reaches zero
  const zeroRow = data.find(r => r.tradBal < 1);
  const zeroText = zeroRow
    ? 'Traditional balance reaches $0 by ' + zeroRow.year + '.'
    : 'Traditional balance does not reach $0 during the projection.';

  const yearRange = startYear === endYear ? String(startYear) : (startYear + '\u2013' + endYear);
  const summaryLine = 'Convert ' + fmt(totalConvertedDisp) + ' over ' + nYears +
    ' year' + (nYears === 1 ? '' : 's') + ' (' + yearRange + '). ' + zeroText +
    ' Estimated total tax cost during conversion years: ' + fmt(totalTaxCostDisp) + '.';

  const columns = [
    { name: 'Year', tip: 'Calendar year of the conversion' },
    { name: 'Age', tip: 'Your age at year-end' },
    { name: 'Convert', tip: 'Gross amount converted from Traditional to Roth this year' },
    { name: 'Tax Cost', tip: 'Total tax for this year (Fed + State + CG + NIIT + penalties + IRMAA). Note: this includes taxes on all income for the year, not just the conversion itself' },
    { name: 'Cumulative Converted', tip: 'Running total of all conversions from the start of the projection through this year' },
    { name: 'Trad. Bal. After', tip: 'Traditional account balance at end of year, showing how much remains to be converted or withdrawn as RMDs' }
  ];

  return React.createElement('div', { className: 'card schedule-card' },
    React.createElement('h3', null, 'Your Conversion Schedule' + (scenarioLabel ? ' (' + scenarioLabel + ')' : '')),
    React.createElement('div', { className: 'table-container' },
      React.createElement('table', { className: 'data-table' },
        React.createElement('thead', null,
          React.createElement('tr', null,
            columns.map(c => React.createElement('th', { key: c.name, title: c.tip }, c.name))
          )
        ),
        React.createElement('tbody', null,
          conversionRows.map(r => React.createElement('tr', { key: r.year },
            React.createElement('td', null, r.year),
            React.createElement('td', null, r.age),
            React.createElement('td', null, fmt(deflate(r.conversionAmount, r.origIdx))),
            React.createElement('td', null, fmt(deflate(r.totalTax, r.origIdx))),
            React.createElement('td', { style: { fontWeight: 600 } }, fmt(deflate(r.cumConverted, r.origIdx))),
            React.createElement('td', null, fmt(deflate(r.tradBal, r.origIdx)))
          ))
        )
      )
    ),
    React.createElement('p', { className: 'schedule-summary' }, summaryLine)
  );
}

/* ---- Chart Expand Overlay ---- */
function ChartOverlay({ title, caption, controls, onClose, children }) {
  useEffect(() => {

    window.addEventListener('keydown', onKey);
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => {
      window.removeEventListener('keydown', onKey);
      document.body.style.overflow = prevOverflow;

  return React.createElement('div', {
    className: 'chart-overlay-backdrop',
    onClick: onClose

    'Standard deduction includes the extra amount for each person 65+. The senior deduction ($6,000 per person 65+, phased out at 6% of MAGI above $75K single / $150K joint, not for married filing separately) applies 2025–2028 only.',
    'Social Security: up to 85% taxable using provisional income (IRS Pub 915). If you have not started yet, your benefit at full retirement age is adjusted for your start age (reduced up to 30% at 62, increased 8%/year after full retirement age up to 70). If your start age is below your current age you already collect, so the amount you enter is used as is. Benefits rise with inflation. The earnings test (benefits withheld while working before full retirement age) is not modeled.',
    'Survivor benefits: a widow(er) can take a survivor benefit from 60, at 71.5% of the late spouse’s benefit at 60 rising each month to 100% at the survivor full retirement age (66–67, two birth years behind the retirement one); nothing is added for waiting longer. The late spouse’s benefit includes any delayed credits they earned; if they started early, the survivor benefit is capped at the larger of what they were getting and 82.5% of their full amount (SSA’s RIB-LIM). The survivor and own benefits are separate: each is fixed by its own start age, and each year you receive the larger one (SSA pays your own plus the excess), so “survivor first, own at 70” and the reverse both work. Simplifications: the survivor reduction is applied to the credit-increased amount (SSA may reduce only the full-retirement-age amount and add the credits, a little more); ages are whole years. Not modeled: disabled widow(er)s’ benefits from 50, benefits for a surviving spouse caring for a child, the loss of the survivor benefit on remarriage before 60, and the $255 lump sum.',
    'Medicare IRMAA: surcharge = Part B premium above the standard premium + Part D adjustment, per person on Medicare (65+), based on MAGI from two years earlier, judged on the thresholds for the filing status of that year’s return (a surviving spouse is judged on the joint return for two years). For the first two projection years (no history yet) this year’s income without the conversion is used. Thresholds grow with bracket inflation, premiums with general inflation.',
    'RMDs: start at 72 (born 1950 or earlier), 73 (1951–1959) or 75 (1960+), from the prior year-end balance using the IRS Uniform Lifetime table, or the Joint Life table when your spouse is more than 10 years younger (assumed sole beneficiary).',
    'Early withdrawals: 10% penalty on traditional withdrawals, and on Roth conversions less than 5 years old, before age 59½ (birthdays assumed mid-year); 20% on non-medical HSA withdrawals before 65. Rule-of-55 and 72(t) exceptions and income tax on early Roth earnings are not modeled. Money already in the Roth at the start is treated as seasoned contributions.',
    'Growth: the growth rate is a total return. In the taxable account the dividend yield is part of that return, taxed each year and reinvested; cost basis uses the average-cost method.',
    'State tax: federal AGI, less taxable Social Security in states that don’t tax it (Colorado taxes it only for people under 65: each person’s benefits are left out from age 65) and retirement income the state exempts (Pennsylvania and Mississippi: IRA/401(k) withdrawals from 59½ plus Roth conversions and pensions; Illinois: all of them at any age), minus the state’s own standard deduction and personal exemptions, taxed at your state’s brackets (or your flat override); personal exemption credits come off the tax. With a flat override and no state picked, the rate applies to federal taxable income.',
    'State tax limits: partial retirement-income exclusions and credits in other states (e.g. New York’s $20,000 pension and annuity exclusion, Georgia’s retirement exclusion, New Jersey’s pension exclusion) are not modeled, so those states’ tax may be overstated. Also not modeled: income phase-outs of state deductions and exemptions (e.g. Connecticut), extra state deductions for age 65+, other state income adjustments, and local income taxes.',
    'Working years: salary minus pre-tax 401(k)/HSA contributions is taxed; contributions go into the accounts. Salary is assumed to cover spending and its own tax, so no cash flows other than a conversion’s extra tax are modeled while working; other income paid in those years is taxed but not saved.',
    'Other income: each stream is paid from its owner’s start age until the age it stops (or for life; a spouse’s stream also ends at the spouse’s projected death), grown from today’s dollars at its own rate (inflation, flat, or a set %). Fully taxable streams are ordinary income; a partly taxable stream counts its taxable share as ordinary income and the rest as tax-free cash; a stream taxed like Social Security is added to that person’s Social Security (taxable by the same up-to-85% formula, treated like Social Security by the state). Once retired, this income pays for spending before the accounts do; it also enters the end-of-plan valuation the way Social Security and pensions do.',
    'Survivor: after your spouse’s life expectancy you file as Single, and a survivor benefit on their record is available from the next year (starting at your survivor start age, or 60, if later). If they had not started Social Security, their benefit at death (with delayed credits past full retirement age) is used. The model assumes you outlive your spouse; if your spouse is expected to live longer, the projection runs to their life expectancy with you still alive.',
    'Claiming suggestion: when a survivor benefit is in play, every whole-year pair of survivor (60–70) and own (62–70) start ages still open to you is valued as the benefits it pays through life expectancy, discounted at your investment growth rate (today’s dollars, before taxes); a pair paying more than $500 over the ages you entered is suggested, never applied on its own. Married couples get it only when the projected death comes before 70.',
    'Not modeled: ACA premium credits, AMT, itemized deductions, head-of-household status, estate taxes, qualified charitable distributions, and exact IRS rounding of indexed amounts.'
  ];
  return React.createElement(Collapsible, { title: 'Key Assumptions', defaultOpen: true },
    React.createElement('ul', { className: 'assumptions-list' },
      items.map((t, i) => React.createElement('li', { key: i }, t)))
  );
}

/* ---- Sources (generated from data/rates.json) ---- */
function SourcesReferences({ rates, onFetcherConfigChange, defaultOpen = true }) {
  const link = (text, url) => React.createElement('a', {
    href: url, target: '_blank', rel: 'noopener noreferrer',
    style: { color: 'var(--accent-teal)', textDecoration: 'underline' }
  }, text);
  return React.createElement(React.Fragment, null,
    React.createElement(Collapsible, { title: 'Sources & References', defaultOpen },
      React.createElement('p', { style: { fontSize: '0.8rem', color: 'var(--text-muted)', marginBottom: 12 } },
        `Every figure the calculator uses, where it comes from, and the tax year it applies to. Data last checked ${fmtDate(rates.lastChecked)}; last changed ${fmtDate(rates.lastUpdated)}.`),
      React.createElement('table', { className: 'data-table sources-table' },
        React.createElement('thead', null, React.createElement('tr', null,
          React.createElement('th', null, 'Figures'), React.createElement('th', null, 'Tax year'),
          React.createElement('th', null, 'Indexed for later years?'), React.createElement('th', null, 'Source'))),
        React.createElement('tbody', null,
          E.REQUIRED_ITEMS.map(k => {
            const it = rates.items[k];
            return React.createElement('tr', { key: k },
              React.createElement('td', null, it.label),
              React.createElement('td', null, it.effectiveYear),
              React.createElement('td', null, it.indexed ? 'Yes' : 'No'),
              React.createElement('td', null, link(it.sourceName, it.source)));
          }),
          rates.items.stateIncomeTax.value.states.filter(s => s.retirementExclusion).map(s =>
            React.createElement('tr', { key: `rx-${s.abbr}` },
              React.createElement('td', null, `${s.name}: retirement income not taxed by the state`),
              React.createElement('td', null, rates.items.stateIncomeTax.effectiveYear),
              React.createElement('td', null, 'No'),
              React.createElement('td', null, link(s.retirementExclusion.sourceName, s.retirementExclusion.source))))
        )
      )
    ),
    React.createElement('div', { style: { marginTop: 16 } },
      React.createElement(FetcherSettings, { onChange: onFetcherConfigChange }))
  );
}

/* ---- Site-owner settings for "Check now" (stored only in this browser) ---- */
function FetcherSettings({ onChange }) {
  const existing = loadFetcherConfig();
  const [url, setUrl] = useState(existing ? existing.url : '');
  const [key, setKey] = useState(existing ? existing.key : '');
  const [msg, setMsg] = useState('');
  const save = () => {
    try {
      if (!url) {
        localStorage.removeItem(FETCHER_CONFIG_KEY);
        setMsg('Removed. "Check now" will only re-read the published data file.');
      } else if (!/^https:\/\/[a-z0-9.-]+\.run\.app(\/|$)/i.test(url)) {
        setMsg('The address must be a Cloud Run URL (https://….run.app).');
        return;
      } else {
        localStorage.setItem(FETCHER_CONFIG_KEY, JSON.stringify({ url, key }));
        setMsg('Saved in this browser only.');
      }
      if (onChange) onChange();
    } catch (err) {
      setMsg('Could not save (browser storage unavailable).');
    }
  };
  return React.createElement(Collapsible, { title: 'Site owner: data updater', defaultOpen: false },
    React.createElement('p', { className: 'chart-caption' },
      'If you run the tax-data fetcher (see README), enter its address and shared secret so "Check now" asks it to fetch the latest official figures. Visitors without the secret just re-read the published data file.'),
    React.createElement('div', { className: 'form-grid' },
      React.createElement('div', { className: 'form-group' },
        React.createElement('label', null, 'Fetcher URL'),
        React.createElement('input', { type: 'url', value: url, placeholder: 'https://tax-data-fetcher-….run.app', onChange: e => setUrl(e.target.value.trim()) })),
      React.createElement('div', { className: 'form-group' },
        React.createElement('label', null, 'Shared secret'),
        React.createElement('input', { type: 'password', value: key, autoComplete: 'off', onChange: e => setKey(e.target.value) }))
    ),
    React.createElement('div', { className: 'profile-actions' },
      React.createElement('button', { type: 'button', onClick: save }, 'Save'),
      msg && React.createElement('span', { className: 'check-message' }, msg))
  );
}

/* ---- Main App Component ---- */
function App() {
  const [inputs, setInputs] = useState(() => {
    const saved = loadSavedProfile();
    return saved ? mergeInputsWithDefaults(saved).inputs : makeDefaultInputs();
  });
  const [hasSavedProfile, setHasSavedProfile] = useState(() => loadSavedProfile() !== null);

  /* Tax data: start with the embedded copy, replace with data/rates.json */
  const [rates, setRates] = useState(EMBEDDED_RATES);
  const td = useMemo(() => E.compileTaxData(rates), [rates]);
  const ratesRef = useRef(rates);
  ratesRef.current = rates;
  const [usingEmbedded, setUsingEmbedded] = useState(true);
  const [pendingRates, setPendingRates] = useState(null);
  const [bannerDismissed, setBannerDismissed] = useState(false);
  const [checkState, setCheckState] = useState({ status: 'idle', message: '' });

  const [validation, setValidation] = useState(null);
  const [results, setResults] = useState(null);
  const [showDetails, setShowDetails] = useState(false);
  const [activeTab, setActiveTab] = useState('summary');
  const [showReal, setShowReal] = useState(false);
  const [calculating, setCalculating] = useState(false);

  const fetchPublished = useCallback((reload) =>
    fetch('data/rates.json', { cache: reload ? 'reload' : 'no-cache' })
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(d => {
        const problems = E.validateRates(d);
        if (problems.length) throw new Error('invalid data: ' + problems[0]);
        return d;
      }), []);

  useEffect(() => {
    fetchPublished(false)
      .then(d => {
        if (E.isNewerRates(ratesRef.current, d)) return; /* embedded copy is newer; keep it */
        setRates(d);
        setUsingEmbedded(false);
      })
      .catch(err => console.warn('Using the embedded tax data:', err.message));
  }, [fetchPublished]);

  /* "Check now": ask the site owner's fetcher (if configured in this
     browser), then re-read the published file, and offer anything newer. */
  const checkNow = useCallback(async () => {
    setCheckState({ status: 'checking', message: '' });
    const candidates = [];
    const notes = [];
    const cfg = loadFetcherConfig();
    if (cfg) {
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 75000);
        const resp = await fetch(cfg.url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Check-Secret': cfg.key || '' },
          body: JSON.stringify({ source: 'check-now' }),
          signal: ctrl.signal
        });
        clearTimeout(timer);
        const body = await resp.json().catch(() => ({}));
        if (!resp.ok) notes.push(body.message || `The data updater returned an error (HTTP ${resp.status}).`);
        else {
          if (body.rates && E.validateRates(body.rates).length === 0) candidates.push(body.rates);
          if (body.message) notes.push(body.message);
        }
      } catch (err) {
        notes.push('Could not reach the data updater.');
      }
    }
    try {
      candidates.push(await fetchPublished(true));
      setUsingEmbedded(false);
    } catch (err) {
      notes.push('Could not load the published data file.');
    }
    const current = ratesRef.current;
    let best = null;
    for (const c of candidates) {
      if (!best || E.isNewerRates(c, best) || (!E.isNewerRates(best, c) && c.lastChecked > best.lastChecked)) best = c;
    }
    const extra = notes.length ? ' ' + notes.join(' ') : '';
    if (!best) {
      setCheckState({ status: 'error', message: notes.join(' ') || 'Check failed.' });
    } else if (E.isNewerRates(best, current)) {
      setPendingRates(best);
      setBannerDismissed(false);
      setCheckState({ status: 'done', message: `Newer ${best.taxYear} figures found.` + extra });
    } else {
      if (best.taxYear === current.taxYear && best.lastUpdated === current.lastUpdated && best.lastChecked > current.lastChecked) {
        setRates(best); /* same figures, more recent check date */
      }
      const checked = best.lastChecked > current.lastChecked ? best.lastChecked : current.lastChecked;
      setCheckState({ status: 'done', message: `Up to date (${current.taxYear} figures, checked ${fmtDate(checked)}).` + extra });
    }
  }, [fetchPublished]);

  const quotaWarningShownRef = useRef(false);
  const saveCurrentInputs = useCallback(() => {
    const ok = saveProfileToStorage(inputs);
    if (ok) {
      setHasSavedProfile(true);
    } else if (!quotaWarningShownRef.current) {
      quotaWarningShownRef.current = true;
      alert("Couldn't save profile to browser storage (quota full or private mode). Use Export to keep a backup.");
    }
  }, [inputs]);

  const calculate = useCallback((inp, tdArg) => {
    const v = E.validateInputs(inp, tdArg);
    setValidation(v);
    if (v.errors.length) {
      setTimeout(() => {
        const el = document.querySelector('.validation-box');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 0);
      return;
    }
    saveCurrentInputs();
    setCalculating(true);
    setTimeout(() => {
      try {
        const result = E.optimizeStrategy(inp, tdArg, {
          goal: normalizeGoal(inp.goal),
          targetBracket: inp.targetBracket || 'auto',
          taxPaymentSource: inp.taxPaymentSource,
          customConversion: Number(inp.customConversion) || 0
        });
        const inflationRate = E.normalizeInputs(inp, tdArg).inflationRate;
        setResults({ result, summary: E.summarizePlan(result, inflationRate), inputs: inp, inflationRate, rates: tdArg.rates });
        setActiveTab('summary');
      } catch (err) {
        console.error('Projection failed:', err);
        alert('Calculation error — please check your inputs and try again.\n\n' + err.message);
      } finally {
        setCalculating(false);
      }
    }, 50);
  }, [saveCurrentInputs]);

  const onCalculate = useCallback(() => {
    setShowDetails(false);
    calculate(inputs, td);
  }, [calculate, inputs, td]);

  /* "Use these ages": adopt the suggested Social Security claiming ages and rerun */
  const applyClaiming = useCallback((ages) => {
    if (!results) return;
    const next = { ...results.inputs, ssStartAge: ages.ssStartAge, survivorStartAge: ages.survivorStartAge };
    setInputs(next);
    setShowDetails(false);
    calculate(next, td);
  }, [results, calculate, td]);

  const applyPending = useCallback(() => {
    if (!pendingRates) return;
    const newTd = E.compileTaxData(pendingRates);
    setRates(pendingRates);
    setPendingRates(null);
    setUsingEmbedded(false);
    setCheckState({ status: 'done', message: `Now using ${pendingRates.taxYear} figures.` });
    if (results) calculate(results.inputs, newTd);
  }, [pendingRates, results, calculate]);

  const banner = !bannerDismissed && React.createElement(TaxDataBanner, {
    rates, pendingRates, checkState, onCheck: checkNow, onApply: applyPending, onDismiss: () => setBannerDismissed(true)
  });
  const dataLine = (dark) => React.createElement(TaxDataLine, { rates, usingEmbedded, checkState, onCheck: checkNow, dark });

  const r = results && results.result;
  const infl = results ? results.inflationRate : 0;
  const tabs = r ? [
    { key: 'summary', label: 'Summary & charts' },
    { key: 'tableB', label: 'Plan: year by year' },
    { key: 'tableA', label: 'No conversion: year by year' },
    r.scenarioC && { key: 'tableC', label: 'Custom: year by year' },
    { key: 'math', label: 'Show the math' },
    { key: 'assumptions', label: 'Assumptions' },
    { key: 'sources', label: 'Sources' }
  ].filter(Boolean) : [];

  return React.createElement('div', { className: 'app-container' },
    banner,
    React.createElement(InputForm, {
      inputs, setInputs, onCalculate, rates, validation,
      taxDataLine: dataLine(false),
      hasSavedProfile, onSaveProfile: saveCurrentInputs
    }),
    React.createElement('div', { className: 'card' },
      React.createElement(SourcesReferences, { rates, defaultOpen: false })
    ),

    calculating && React.createElement('div', { className: 'results-overlay' },
      React.createElement('div', { className: 'results-inner' },
        React.createElement('div', { className: 'card loading' },
          React.createElement('div', { className: 'spinner' }),
          React.createElement('div', null, 'Comparing strategies…')
        )
      )
    ),

    r && !calculating && React.createElement('div', { className: 'results-overlay' },
      React.createElement('div', { className: 'results-inner' },
        React.createElement('div', { className: 'results-header' },
          React.createElement('div', null,
            React.createElement('h1', { style: { fontSize: '1.4rem', margin: 0 } }, 'Your Roth conversion plan'),
            dataLine(true)
          ),
          React.createElement('button', { className: 'results-close', onClick: () => setResults(null) }, '← Edit Inputs')
        ),
        banner,
        React.createElement(PlainSummary, { result: r, summary: results.summary, inputs: results.inputs, rates: results.rates, inflationRate: infl, onApplyClaiming: applyClaiming }),

        React.createElement('div', { className: 'details-toggle' },
          React.createElement('button', {
            type: 'button', className: 'btn btn-secondary', 'aria-expanded': showDetails,
            onClick: () => setShowDetails(!showDetails)
          }, showDetails ? 'Hide details ▴' : 'Show details — charts, year-by-year tables and the full math ▾')
        ),

        showDetails && React.createElement('div', { className: 'details-view' },
          React.createElement('div', { className: 'results-header' },
            React.createElement('div', { className: 'tabs', style: { marginBottom: 0 } },
              tabs.map(t => React.createElement('div', {
                key: t.key, className: `tab ${activeTab === t.key ? 'active' : ''}`,
                role: 'tab', tabIndex: 0,
                onClick: () => setActiveTab(t.key),
                onKeyDown: (e) => { if (e.key === 'Enter' || e.key === ' ') setActiveTab(t.key); }
              }, t.label))
            ),
            React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap' } },
              React.createElement('div', { className: 'toggle-group' },
                React.createElement('span', null, 'Future dollars'),
                React.createElement('div', {
                  className: `toggle-switch ${showReal ? 'active' : ''}`, role: 'switch', 'aria-checked': showReal, tabIndex: 0,
                  onClick: () => setShowReal(!showReal),
                  onKeyDown: (e) => { if (e.key === 'Enter' || e.key === ' ') setShowReal(!showReal); }
                }),
                React.createElement('span', null, "Today’s dollars")
              )
            )
          ),

          activeTab === 'summary' && React.createElement(React.Fragment, null,
            React.createElement(SummaryDashboard, { result: r, showReal, inflationRate: infl }),
            React.createElement(Charts, { scenarioA: r.scenarioA, scenarioB: r.scenarioB, scenarioC: r.scenarioC, showReal, inflationRate: infl, goal: r.goal })
          ),
          activeTab === 'tableA' && React.createElement('div', { className: 'card' },
            React.createElement('h2', null, 'No Roth conversions'),
            React.createElement(ProjectionTable, { data: r.scenarioA, label: 'No Conversion', showReal, inflationRate: infl })
          ),
          activeTab === 'tableB' && React.createElement(React.Fragment, null,
            React.createElement(ConversionSchedule, { data: r.scenarioB, scenarioLabel: 'Suggested plan', showReal, inflationRate: infl }),
            React.createElement('div', { className: 'card' },
              React.createElement('h2', null, 'Suggested plan'),
              React.createElement(ProjectionTable, { data: r.scenarioB, label: 'Suggested', showReal, inflationRate: infl })
            )
          ),
          activeTab === 'tableC' && r.scenarioC && React.createElement(React.Fragment, null,
            React.createElement(ConversionSchedule, { data: r.scenarioC, scenarioLabel: 'Custom', showReal, inflationRate: infl }),
            React.createElement('div', { className: 'card' },
              React.createElement('h2', null, 'Custom fixed conversions'),
              React.createElement(ProjectionTable, { data: r.scenarioC, label: 'Custom', showReal, inflationRate: infl })
            )
          ),
          activeTab === 'math' && React.createElement(YearMath, { result: r, rates: results.rates }),
          activeTab === 'assumptions' && React.createElement('div', { className: 'card' },
            React.createElement(KeyAssumptions, { rates: results.rates })
          ),
          activeTab === 'sources' && React.createElement('div', { className: 'card' },
            React.createElement(SourcesReferences, { rates })
          )
        )
      )
    )
  );
}

/* Mount the application */
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
